{% extends "base.html" %}
{% block title %}Manage Subjects{% endblock %}
{% block content %}
<h2>⚙️ Manage Subjects</h2>
<form method="POST" class="form-card">
    <label>Subject Name</label>
    <input type="text" name="name" required>
    <label>Assign Teacher</label>
    <select name="teacher_id">
        <option value="">-- None --</option>
        {% for t in teachers %}
        <option value="{{ t.id }}">{{ t.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn-primary">Add Subject</button>
</form>

<table class="data-table">
    <thead><tr><th>Subject</th><th>Teacher</th></tr></thead>
    <tbody>
        {% for s in subjects %}
        <tr><td>{{ s.name }}</td><td>{{ s.teacher.name if s.teacher else '—' }}</td></tr>
        {% else %}
        <tr><td colspan="2">No subjects yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
